# Render deployment configuration.
#
# This file lets Render auto-detect how to build and run the backend
# as a "Web Service", and provisions a free PostgreSQL database.
#
# To use: in the Render dashboard, choose "New > Blueprint" and point
# it at this repo. Render will read this file automatically.

services:
  - type: web
    name: forensic-recon-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: forensic-recon-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: "[\"https://YOUR-NETLIFY-SITE.netlify.app\"]"

databases:
  - name: forensic-recon-db
    plan: free
    region: oregon